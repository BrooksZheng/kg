# kg protocol: Project Document Taxonomy.
# Templates are logical source paths for lazy creation. M1 defines the
# taxonomy only and does not create or publish the templates.

kind: kg.document_taxonomy
version: 1

core_types: [architecture, decision, standard, api, runbook, trap, debt, glossary]
spec_type: spec

documents:
  architecture:
    path: docs/architecture/
    template_path: skills/kg-docs/assets/templates/architecture.md
    create_target_pattern: docs/architecture/overview.md
    diataxis_quadrant: explanation
    arc42_sections: "3|5|6|7|8|10"
    detection_rule: "Detect a registered architecture document under the configured path."
    lazy_create_when: "Architecture understanding first crystallizes."
  decision:
    path: docs/decisions/
    template_path: skills/kg-docs/assets/templates/decision.md
    create_target_pattern: docs/decisions/{sequence}-{slug}.md
    diataxis_quadrant: explanation
    arc42_sections: "9"
    detection_rule: "Detect a registered decision document under the configured path."
    lazy_create_when: "All three ADR criteria are met and the human approves drafting."
  standard:
    path: docs/standards/
    template_path: skills/kg-docs/assets/templates/standard.md
    create_target_pattern: docs/standards/{slug}.md
    diataxis_quadrant: reference
    arc42_sections: "2"
    detection_rule: "Detect a registered standard document under the configured path."
    lazy_create_when: "A project-specific engineering standard first becomes necessary."
  api:
    path: docs/api/
    template_path: skills/kg-docs/assets/templates/api.md
    create_target_pattern: docs/api/{slug}.md
    diataxis_quadrant: reference
    arc42_sections: "5|8"
    detection_rule: "Detect a registered API reference under the configured path."
    lazy_create_when: "A stable API surface first requires documentation."
  runbook:
    path: docs/runbooks/
    template_path: skills/kg-docs/assets/templates/runbook.md
    create_target_pattern: docs/runbooks/{slug}.md
    diataxis_quadrant: howto
    arc42_sections: "7|11"
    detection_rule: "Detect a registered operational runbook under the configured path."
    lazy_create_when: "A repeatable operational procedure first appears."
  trap:
    path: docs/traps/
    template_path: skills/kg-docs/assets/templates/trap.md
    create_target_pattern: docs/traps/trap-{slug}.md
    diataxis_quadrant: howto
    arc42_sections: "8|11"
    detection_rule: "Detect a registered trap document under the configured path."
    lazy_create_when: "A project-specific failure mode is verified."
  debt:
    path: docs/traps/
    template_path: skills/kg-docs/assets/templates/debt.md
    create_target_pattern: docs/traps/debt-{slug}.md
    diataxis_quadrant: explanation
    arc42_sections: "8|10|11"
    detection_rule: "Detect a registered debt document under the configured path."
    lazy_create_when: "Accepted debt needs an explicit cost and exit condition."
  glossary:
    path: docs/glossary.md
    template_path: skills/kg-docs/assets/templates/glossary.md
    create_target_pattern: docs/glossary.md
    diataxis_quadrant: reference
    arc42_sections: "12"
    detection_rule: "Detect the project glossary at the configured path."
    lazy_create_when: "A project-specific term first crystallizes."
  spec:
    path: docs/specs/
    template_path: skills/kg-spec/assets/templates/task-spec.md
    diataxis_quadrant: reference
    arc42_sections: "1|2|10"
    detection_rule: "Detect a kg.task_spec document under the configured path."
    lazy_create_when: "kg-spec first finalizes a confirmed conversation."

tutorials:
  diataxis_quadrant: excluded
  exclusion_rationale: "kg serves project agents and engineers who need project operations and reference material, not an external learner curriculum."
