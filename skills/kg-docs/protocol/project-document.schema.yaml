# kg protocol: opt-in project document source contract (RFC-004).
#
# Ordinary Markdown is outside this schema. A file enters the contract only
# when its frontmatter declares `kind: kg.project_document`. Drafts remain
# directly editable collaboration artifacts. Compile consumes accepted files.

kind: kg.project_document_schema
version: 1

fields:
  kind: { type: enum, required: true, values: "kg.project_document" }
  title: { type: string, required: true }
  doc_type: { type: enum, required: true, values: "architecture|decision|rfc|glossary|standard|development|api|runbook|inventory|proposal|trap|debt|spec" }
  status: { type: enum, required: true, values: "draft|proposed|accepted|rejected|superseded" }
  owners: { type: string_list, required: false }
  accepted_at: { type: date, required: false }
  supersedes: { type: string_or_null, required: true }
  superseded_by: { type: string_or_null, required: false }
  source_refs: { type: string_list, required: false }
  coverage_limitations: { type: string_list, required: false }
