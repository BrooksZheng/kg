# kg protocol: agent-assisted semantic findings kept separate from scan gates.

kind: kg.scan_agent_report_schema
version: 1
product_kind: kg.scan_agent_report
product_version: 1
detection_mode_values: [agent_assisted]
finding_type_values: [semantic_contradiction, semantic_coverage_gap]
severity_values: [advisory, warning, critical]
semantic_gap_issue_code: semantic_coverage_gap

# Shared source-ref contract. The named captures are interpreted by
# scripts/lib/document-anchor.mjs. Writers accept this input form and apply
# the declared canonicalization before product identity or bytes are derived.
source_ref_pattern: "^(?<path>.+)#L(?<line_start>[1-9][0-9]*)(?:-L(?<line_end>[1-9][0-9]*))?$"
source_ref_canonicalization: equal_line_range_to_single_line

# The evidence packet is a script-produced agent input, not a kg.* product.
# These orders are interpreted by prepare-agent-evidence.mjs and the report
# writer so packet identity and source membership have one protocol authority.
evidence_packet_version: 1
evidence_packet_field_order: "version|project_root|base_report_path|base_report_sha256|sources"
evidence_source_field_order: "path|sha256|line_count|content"

field_order:
  - kind
  - version
  - report_id
  - generated_at
  - base_report_path
  - base_report_sha256
  - evidence_packet_path
  - evidence_packet_sha256
  - detection_mode
  - model
  - session_id
  - findings

record_field_order:
  findings: "finding_id|detection_mode|type|severity|confidence|subject|source_refs|analysis|recommendation|module_identity|coverage_evidence|missing_evidence"

script_owned_fields: "kind|version|report_id|generated_at|base_report_path|base_report_sha256|evidence_packet_path|evidence_packet_sha256|detection_mode|findings[].finding_id|findings[].detection_mode"

fields:
  kind: { type: enum, required: true, values: "kg.scan_agent_report" }
  version: { type: integer, required: true, values: "1" }
  report_id: { type: string, required: true, pattern: "^SCAN-A-[A-F0-9]{12}$" }
  generated_at: { type: timestamp, required: true }
  base_report_path: { type: string, required: true }
  base_report_sha256: { type: string, required: true, pattern: "^sha256:[a-f0-9]{64}$" }
  evidence_packet_path: { type: string, required: true }
  evidence_packet_sha256: { type: string, required: true, pattern: "^sha256:[a-f0-9]{64}$" }
  detection_mode: { type: enum_from, required: true, values_from: detection_mode_values }
  model: { type: string, required: true }
  session_id: { type: string, required: true }
  findings: { type: map_list, required: true, unique_by: finding_id }
  findings[].finding_id: { type: string, required: true, pattern: "^SAF-[A-F0-9]{12}$" }
  findings[].detection_mode: { type: enum_from, required: true, values_from: detection_mode_values }
  findings[].type: { type: enum_from, required: true, values_from: finding_type_values }
  findings[].severity: { type: enum_from, required: true, values_from: severity_values }
  findings[].confidence: { type: float, required: true, min: 0, max: 1 }
  findings[].subject: { type: string, required: true }
  findings[].source_refs: { type: string_list, required: true, min_items: 1, unique: true, pattern_from: source_ref_pattern }
  findings[].analysis: { type: string, required: true }
  findings[].recommendation: { type: string, required: true }
  findings[].module_identity: { type: string_or_null, required: true }
  findings[].coverage_evidence: { type: string_list, required: true, unique: true, pattern_from: source_ref_pattern }
  findings[].missing_evidence: { type: string_list, required: true, unique: true }
