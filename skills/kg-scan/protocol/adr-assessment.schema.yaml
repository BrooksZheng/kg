# kg protocol: agent-assisted ADR criterion assessment with human approval.

kind: kg.adr_assessment_schema
version: 1
product_kind: kg.adr_assessment
product_version: 1
detection_mode_values: [agent_assisted]

# KN-0034: this is the only machine criterion table for ADR assessment.
criteria:
  hard_to_reverse: { description: "Reversing the decision has material cost or risk." }
  context_not_in_code: { description: "Code alone cannot preserve the decision context safely." }
  genuine_tradeoff: { description: "At least two viable options carry a real engineering tradeoff." }

field_order:
  - kind
  - version
  - assessment_id
  - assessed_at
  - detection_mode
  - candidate_ref
  - evidence_packet_sha256
  - criteria
  - human_approval_message_index
  - human_approval_sha256
  - eligible_for_draft

record_field_order:
  criteria: "criterion_id|conclusion|confidence|evidence_refs"

script_owned_fields: "kind|version|assessment_id|assessed_at|detection_mode|evidence_packet_sha256|human_approval_sha256|eligible_for_draft"

fields:
  kind: { type: enum, required: true, values: "kg.adr_assessment" }
  version: { type: integer, required: true, values: "1" }
  assessment_id: { type: string, required: true, pattern: "^ADR-ASSESS-[A-F0-9]{12}$" }
  assessed_at: { type: timestamp, required: true }
  detection_mode: { type: enum_from, required: true, values_from: detection_mode_values }
  candidate_ref: { type: string, required: true }
  evidence_packet_sha256: { type: string, required: true, pattern: "^sha256:[a-f0-9]{64}$" }
  criteria: { type: map_list, required: true, min_items: 3, max_items: 3, unique_by: criterion_id }
  criteria[].criterion_id: { type: enum_from, required: true, values_from: criteria }
  criteria[].conclusion: { type: boolean, required: true }
  criteria[].confidence: { type: float, required: true, min: 0, max: 1 }
  criteria[].evidence_refs: { type: string_list, required: true, min_items: 1 }
  human_approval_message_index: { type: integer, required: true, min: 0 }
  human_approval_sha256: { type: string, required: true, pattern: "^sha256:[a-f0-9]{64}$" }
  eligible_for_draft: { type: boolean, required: true }
